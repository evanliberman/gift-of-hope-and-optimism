</style></head><body><header><div class="wrap"><div class="eyebrow">Congregational study · Private reflection</div><h1>The Gift of<br>Hope and Optimism</h1><p>A Scripture-centered guide to trusting God in an uncertain future</p></div></header><main><div class="topline"><span id="pageNum">PAGE 1 OF 11</span><span id="sectionName">WELCOME</span></div><div class="progress"><span id="bar"></span></div><article class="sheet" id="page" aria-live="polite"></article><footer>KJV Scripture text · Your reflections stay on this device unless you choose to share them</footer></main><nav class="nav"><div class="navInner"><button class="btn secondary" id="prev" type="button">← Back</button><span class="wait">Follow the speaker's page instructions</span><button class="btn" id="next" type="button">Next →</button></div></nav><div id="toast" class="toast" role="status"></div><script>
const LIB=[{"name": "Financial hardship", "verses": [{"ref": "Matthew 6:31–33", "text": "Therefore take no thought, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed? (For after all these things do the Gentiles seek:) for your heavenly Father knoweth that ye have need of all these things. But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."}, {"ref": "Philippians 4:12–13", "text": "I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need. I can do all things through Christ which strengtheneth me."}], "truth": "God knows our needs. Messiah strengthens us through both abundance and need; these verses do not guarantee wealth."}, {"name": "Employment and livelihood", "verses": [{"ref": "Colossians 3:23–24", "text": "And whatsoever ye do, do it heartily, as to the Lord, and not unto men; Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ."}, {"ref": "Philippians 4:6–7", "text": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."}], "truth": "We can serve Messiah through our work and bring employment concerns to God; a particular job is not guaranteed."}, {"name": "Future financial security", "verses": [{"ref": "1 Timothy 6:17", "text": "Charge them that are rich in this world, that they be not highminded, nor trust in uncertain riches, but in the living God, who giveth us richly all things to enjoy;"}, {"ref": "Hebrews 13:5", "text": "Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee."}], "truth": "Riches are uncertain; God’s presence is not."}, {"name": "Children and grandchildren", "verses": [{"ref": "Deuteronomy 6:6–7", "text": "And these words, which I command thee this day, shall be in thine heart: And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up."}, {"ref": "Philippians 4:6–7", "text": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."}], "truth": "Teach God’s Word faithfully and pray for children; their individual choices are not guaranteed."}, {"name": "Marriage and family conflict", "verses": [{"ref": "Romans 12:18", "text": "If it be possible, as much as lieth in you, live peaceably with all men."}, {"ref": "Ephesians 4:32", "text": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you."}], "truth": "Pursue peace, kindness and forgiveness; reconciliation can depend on others."}, {"name": "Loneliness and rejection", "verses": [{"ref": "Hebrews 13:5–6", "text": "For he hath said, I will never leave thee, nor forsake thee. So that we may boldly say, The Lord is my helper, and I will not fear what man shall do unto me."}, {"ref": "Romans 8:38–39", "text": "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord."}], "truth": "God’s presence and His love in Messiah endure despite rejection."}, {"name": "Aging parents and caregiving", "verses": [{"ref": "1 Timothy 5:4", "text": "But if any widow have children or nephews, let them learn first to shew piety at home, and to requite their parents: for that is good and acceptable before God."}, {"ref": "James 1:5", "text": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."}], "truth": "Caring for family honors God; ask Him for wisdom."}, {"name": "Personal health", "verses": [{"ref": "2 Corinthians 12:9", "text": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me."}, {"ref": "Romans 8:23", "text": "And not only they, but ourselves also, which have the firstfruits of the Spirit, even we ourselves groan within ourselves, waiting for the adoption, to wit, the redemption of our body."}], "truth": "God’s grace is sufficient in weakness; believers await bodily redemption."}, {"name": "Anxiety, discouragement, and exhaustion", "verses": [{"ref": "1 Peter 5:7", "text": "Casting all your care upon him; for he careth for you."}, {"ref": "Psalm 42:5", "text": "Why art thou cast down, O my soul? and why art thou disquieted in me? hope thou in God: for I shall yet praise him for the help of his countenance."}], "truth": "We can bring cares to God while honestly acknowledging distress."}, {"name": "War and physical danger", "verses": [{"ref": "Psalm 46:1–2", "text": "God is our refuge and strength, a very present help in trouble. Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;"}, {"ref": "Psalm 56:3–4", "text": "What time I am afraid, I will trust in thee. In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me."}], "truth": "Trust God amid danger; these passages do not promise immunity from harm."}, {"name": "Loss and bereavement", "verses": [{"ref": "1 Thessalonians 4:13–14", "text": "But I would not have you to be ignorant, brethren, concerning them which are asleep, that ye sorrow not, even as others which have no hope. For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with him."}, {"ref": "John 11:25–26", "text": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die. Believest thou this?"}], "truth": "Believers grieve with resurrection hope in Yeshua."}, {"name": "Continuing suffering", "verses": [{"ref": "Romans 8:18", "text": "For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us."}, {"ref": "Revelation 21:4", "text": "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."}], "truth": "Present suffering is real; God promises the final end of death and pain."}, {"name": "Fear of failure", "verses": [{"ref": "1 Corinthians 15:58", "text": "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord."}, {"ref": "Mark 8:36", "text": "For what shall it profit a man, if he shall gain the whole world, and lose his own soul?"}], "truth": "Faithfulness in the Lord’s work matters more than worldly success."}, {"name": "Major decisions and uncertainty", "verses": [{"ref": "James 1:5", "text": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."}, {"ref": "Proverbs 3:5–6", "text": "Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."}], "truth": "Seek wisdom, trust God, and make responsible decisions."}, {"name": "Purpose and significance", "verses": [{"ref": "Ephesians 2:10", "text": "For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them."}, {"ref": "Colossians 1:16", "text": "For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him."}], "truth": "Believers are created in Messiah for good works; all things exist for Him."}, {"name": "Aging and mortality", "verses": [{"ref": "Psalm 90:12", "text": "So teach us to number our days, that we may apply our hearts unto wisdom."}, {"ref": "John 11:25–26", "text": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die: Believest thou this?"}], "truth": "Live wisely in view of life’s brevity and resurrection hope in Yeshua."}, {"name": "Regrets and past mistakes", "verses": [{"ref": "1 John 1:9", "text": "If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness."}, {"ref": "Romans 8:1", "text": "There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit."}], "truth": "God forgives confessed sin; earthly consequences may remain."}, {"name": "Change and loss of control", "verses": [{"ref": "James 4:13–15", "text": "Go to now, ye that say, To day or to morrow we will go into such a city, and continue there a year, and buy and sell, and get gain: Whereas ye know not what shall be on the morrow. For what is your life? It is even a vapour, that appeareth for a little time, and then vanisheth away. For that ye ought to say, If the Lord will, we shall live, and do this, or that."}, {"ref": "Hebrews 13:8", "text": "Jesus Christ the same yesterday, and to day, and for ever."}], "truth": "We do not control tomorrow, but Yeshua remains the same."}, {"name": "Spiritual weakness or doubt", "verses": [{"ref": "Mark 9:24", "text": "And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief."}, {"ref": "Hebrews 4:15–16", "text": "For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin. Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need."}], "truth": "Bring weakness and doubt honestly to God and seek grace through Yeshua."}, {"name": "Temptation and repeated sin", "verses": [{"ref": "1 Corinthians 10:13", "text": "There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it."}, {"ref": "1 John 2:1", "text": "My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:"}], "truth": "God is faithful amid temptation; Yeshua is the believer’s advocate."}, {"name": "Opposition because of faith", "verses": [{"ref": "John 16:33", "text": "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world."}, {"ref": "1 Peter 4:14", "text": "If ye be reproached for the name of Christ, happy are ye; for the spirit of glory and of God resteth upon you: on their part he is evil spoken of, but on your part he is glorified."}], "truth": "Opposition for Yeshua’s name does not mean God has abandoned us."}, {"name": "Loved ones who do not believe", "verses": [{"ref": "1 Timothy 2:3–4", "text": "For this is good and acceptable in the sight of God our Saviour; Who will have all men to be saved, and to come unto the knowledge of the truth."}, {"ref": "Romans 10:13–14", "text": "For whosoever shall call upon the name of the Lord shall be saved. How then shall they call on him in whom they have not believed? and how shall they believe in him of whom they have not heard? and how shall they hear without a preacher?"}], "truth": "Pray and proclaim the good news faithfully without assuming a guaranteed individual response."}], V={"Numbers 13:27–28": "And they told him, and said, We came unto the land whither thou sentest us, and surely it floweth with milk and honey; and this is the fruit of it. Nevertheless the people be strong that dwell in the land, and the cities are walled, and very great: and moreover we saw the children of Anak there.", "Numbers 13:30–31": "And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it. But the men that went up with him said, We be not able to go up against the people; for they are stronger than we.", "Numbers 13:33": "And there we saw the giants, the sons of Anak, which come of the giants: and we were in our own sight as grasshoppers, and so we were in their sight.", "Numbers 14:8–9": "If the LORD delight in us, then he will bring us into this land, and give it us; a land which floweth with milk and honey. Only rebel not ye against the LORD, neither fear ye the people of the land; for they are bread for us: their defence is departed from them, and the LORD is with us: fear them not.", "Exodus 3:8": "And I am come down to deliver them out of the hand of the Egyptians, and to bring them up out of that land unto a good land and a large, unto a land flowing with milk and honey; unto the place of the Canaanites, and the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites.", "Romans 15:13": "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", "Hebrews 10:23": "Let us hold fast the profession of our faith without wavering; (for he is faithful that promised;)", "Isaiah 41:10": "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.", "Romans 8:28": "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", "1 Peter 1:3–4": "Blessed be the God and Father of our Lord Jesus Christ, which according to his abundant mercy hath begotten us again unto a lively hope by the resurrection of Jesus Christ from the dead, To an inheritance incorruptible, and undefiled, and that fadeth not away, reserved in heaven for you,", "Hebrews 11:35–38": "Women received their dead raised to life again: and others were tortured, not accepting deliverance; that they might obtain a better resurrection: And others had trial of cruel mockings and scourgings, yea, moreover of bonds and imprisonment: They were stoned, they were sawn asunder, were tempted, were slain with the sword: they wandered about in sheepskins and goatskins; being destitute, afflicted, tormented; (Of whom the world was not worthy:) they wandered in deserts, and in mountains, and in dens and caves of the earth.", "Habakkuk 3:17–19": "Although the fig tree shall not blossom, neither shall fruit be in the vines; the labour of the olive shall fail, and the fields shall yield no meat; the flock shall be cut off from the fold, and there shall be no herd in the stalls: Yet I will rejoice in the LORD, I will joy in the God of my salvation. The LORD God is my strength, and he will make my feet like hinds’ feet, and he will make me to walk upon mine high places.", "John 16:33": "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.", "John 8:31–32": "Then said Jesus to those Jews which believed on him, If ye continue in my word, then are ye my disciples indeed; And ye shall know the truth, and the truth shall make you free.", "John 17:17": "Sanctify them through thy truth: thy word is truth.", "Romans 12:1–2": "I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.", "2 Corinthians 10:4–5": "(For the weapons of our warfare are not carnal, but mighty through God to the pulling down of strong holds;) Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;", "Philippians 4:6–8": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus. Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things.", "Psalm 56:3–4": "What time I am afraid, I will trust in thee. In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me.", "Psalm 139:23–24": "Search me, O God, and know my heart: try me, and know my thoughts: And see if there be any wicked way in me, and lead me in the way everlasting.", "Psalm 42:5": "Why art thou cast down, O my soul? and why art thou disquieted in me? hope thou in God: for I shall yet praise him for the help of his countenance.", "James 1:22": "But be ye doers of the word, and not hearers only, deceiving your own selves.", "Philippians 4:6–7": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.", "Romans 15:4": "For whatsoever things were written aforetime were written for our learning, that we through patience and comfort of the scriptures might have hope.", "1 Thessalonians 5:11": "Wherefore comfort yourselves together, and edify one another, even as also ye do.", "Hebrews 10:24–25": "And let us consider one another to provoke unto love and to good works: Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching."}, PAGES=[["Welcome", "Begin with hope"], ["Your outlook", "A private five-question reflection"], ["The twelve spies", "Same circumstances, different responses"], ["The God of hope", "The foundation of our confidence"], ["Hope in suffering", "Hope does not deny hardship"], ["Truth and our thoughts", "Renewing our minds through Scripture"], ["Name your concern", "Step 1 of 4"], ["Examine your beliefs", "Step 2 of 4"], ["Find God’s truth", "Step 3 of 4"], ["Respond in faith", "Step 4 of 4"], ["Give hope to others", "Review, save, and return this week"]];
const QUESTIONS=['When I think about my future, I generally expect good things rather than bad things.','When unexpected difficulties arise, my first reaction is usually to believe that things can improve.','When circumstances are uncertain, I tend to focus more on what could go right than what could go wrong.','Even when I experience setbacks, I generally expect to find a way forward.','When I consider the coming years, I feel more hopeful than fearful.'];
const GROUPS=[['FINANCIAL SECURITY & WORK',0,3],['FAMILY & RELATIONSHIPS',3,7],['HEALTH, SAFETY & SUFFERING',7,12],['FUTURE, IDENTITY & PURPOSE',12,18],['FAITH & SPIRITUAL LIFE',18,22]];
const KEY='gift-hope-optimism-study-v1';let state={page:0,scores:[0,0,0,0,0],concern:null,selected:[],fear:'',beliefs:'',other:'',truth:'',commitment:'',person:''};try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object')state={...state,...saved}}catch(e){};

function field(key,label,placeholder='Write privately here…'){return `<label class="field" for="f_${key}">${esc(label)}</label><textarea id="f_${key}" data-field="${key}" placeholder="${esc(placeholder)}">${esc(state[key])}</textarea>`}
function render(){const n=state.page;document.getElementById('pageNum').textContent=`PAGE ${n+1} OF 11`;document.getElementById('sectionName').textContent=PAGES[n][0].toUpperCase();document.getElementById('bar').style.width=((n+1)/11*100)+'%';document.getElementById('prev').disabled=n===0;document.getElementById('next').textContent=n===10?'Back to start ↺':'Next →';let body='';
if(n===0)body=`<div class="kicker">Page 1 · Welcome</div><h2>Where do you place your hope?</h2><p class="subtitle">A personal journey through Scripture during today's message.</p><div class="note"><strong>How it works</strong><br>Follow the speaker's instructions to move between pages. Your answers are private and are not sent to the congregation or the speaker.</div><div class="scripture"><strong>Romans 15:13</strong><p>${esc(V['Romans 15:13'])}</p></div><h3>What you'll do</h3><p>1. Reflect on your natural outlook.<br>2. Read Scriptures about hope.<br>3. Identify a concern and find relevant biblical truth.<br>4. Write one step of faith for the coming week.</p><p class="small">Your progress is saved in this browser when available. At the end, download your completed study for reliable long-term access.</p>`;
if(n===1){const total=state.scores.reduce((a,b)=>a+b,0),done=state.scores.filter(Boolean).length;body=`<div class="kicker">Page 2 · Private assessment</div><h2>How do you usually see the future?</h2><p class="subtitle">For each statement, choose how strongly you agree. This is a reflection tool, not a measure of your faith.</p>`+QUESTIONS.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q)}</h3><div class="scale">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="score${i}" value="${v}" data-score="${i}" ${state.scores[i]===v?'checked':''}><br>${v}</label>`).join('')}</div><div class="scaleLegend"><span>Strongly disagree</span><span>Strongly agree</span></div></div>`).join('')+`<div class="score"><div class="small">Your score · ${done} of 5 answered</div><b>${done===5?total:'—'}${done===5?' / 25':''}</b><p>${done!==5?'Complete all five statements to see your reflection.':total<=11?'Your answers lean toward a more pessimistic outlook.':total<=18?'Your answers reflect a mixed or cautious outlook.':'Your answers lean toward a more optimistic outlook.'}</p><p class="small">These score bands are illustrative, not clinically or scientifically validated.</p></div>`}
if(n===2)body=`<div class="kicker">Page 3 · Numbers 13–14</div><h2>The same land. Two different conclusions.</h2><p>All twelve spies saw the same circumstances. What changed was how they responded.</p>${scripture('Numbers 13:27–28')}${scripture('Numbers 13:30–31')}${scripture('Numbers 13:33')}<div class="note">Notice: “We were in our own sight as grasshoppers.” The passage reports the spies' perception; it does not independently confirm what the inhabitants thought.</div>${scripture('Numbers 14:8–9')}${scripture('Exodus 3:8')}<p class="small">Remember: God had made Israel a specific promise. We should hold to promises Scripture actually makes, not assume every desired outcome is guaranteed.</p>`;
if(n===3)body=`<div class="kicker">Page 4 · The foundation of hope</div><h2>Why can believers have hope?</h2>${scripture('Romans 15:13')}${scripture('Hebrews 10:23')}<div class="note">Our confidence rests on the faithfulness of the One who promised—not merely on our determination to feel hopeful.</div>${scripture('Isaiah 41:10')}${scripture('Romans 8:28')}${scripture('1 Peter 1:3–4')}<p class="small">Isaiah 41 originally addresses Israel. Romans 8:28 does not promise that every event will feel good. Our living hope rests in Yeshua's resurrection.</p>`;
if(n===4)body=`<div class="kicker">Page 5 · Hope amid suffering</div><h2>Hope does not mean denying pain.</h2>${scripture('Hebrews 11:35–38')}${scripture('Habakkuk 3:17–19')}${scripture('John 16:33')}<div class="note">Biblical hope does not promise an easy life. It directs our trust to God, including when circumstances do not improve.</div>`;
if(n===5)body=`<div class="kicker">Page 6 · Truth and our thoughts</div><h2>What is shaping what you believe?</h2><p>Sometimes we conclude: “God has forgotten me,” “I am alone,” or “My future is hopeless.” Compare these conclusions with what Scripture actually teaches.</p>${scripture('John 8:31–32')}${scripture('John 17:17')}${scripture('Romans 12:1–2')}${scripture('2 Corinthians 10:4–5')}${scripture('Philippians 4:6–8')}<div class="note">Private question: Is there something you believe about God, yourself, or your future that may contradict His Word?</div>`;
if(n===6)body=`<div class="kicker">Page 7 · Personal reflection · Step 1</div><h2>What is troubling you?</h2>${scripture('Psalm 56:3–4')}<p>Identify one concern you want to bring before God today. You can choose a category now and explore its Scriptures on page 9.</p><label class="field" for="concern">Choose the closest category</label><select id="concern" style="width:100%;padding:13px;border-radius:10px;border:1px solid #b9c9c4;background:white;font:inherit"><option value="">Select a concern…</option>${LIB.map((x,i)=>`<option value="${i}" ${state.concern===i?'selected':''}>${i+1}. ${esc(x.name)}</option>`).join('')}</select>${field('fear','What exactly am I afraid might happen?')}<p class="small">You may write as much or as little as you wish. This response stays on your device.</p>`;
if(n===7)body=`<div class="kicker">Page 8 · Personal reflection · Step 2</div><h2>What have I come to believe?</h2>${scripture('Psalm 139:23–24')}<p>Look at the concern you just wrote. Which parts are known facts? Which parts are fears or assumptions? Are you believing anything about God that contradicts His Word?</p>${state.fear?`<div class="review"><strong>Your concern</strong><p>${esc(state.fear)}</p></div>`:''}${field('beliefs','What am I believing about God, His faithfulness, or my future?')}<div class="note">The goal is not to deny real hardship, but to distinguish it from conclusions God has not told us to believe.</div>`;
if(n===8){let idx=state.concern, item=idx===null?null:LIB[idx];body=`<div class="kicker">Page 9 · Personal reflection · Step 3</div><h2>Find God's truth for your situation.</h2>${scripture('Psalm 42:5')}${scripture('Hebrews 10:23')}<p>Choose your concern. Read the suggested passages carefully and select any that genuinely apply to your situation.</p><div class="groupHeading">22 COMMON CONCERNS</div><div class="categories">${LIB.map((x,i)=>`<button class="category ${idx===i?'active':''}" data-category="${i}"><span>${i+1}.</span>${esc(x.name)}</button>`).join('')}</div>`;
if(item){body+=`<hr class="divider"><h3>${esc(item.name)}</h3>${item.verses.map((v,j)=>{const id=`${idx}:${j}`;return `<div class="verseOption"><label><input type="checkbox" data-verse="${id}" ${state.selected.includes(id)?'checked':''}> ${esc(v.ref)}</label><p>${esc(v.text)}</p></div>`}).join('')}<div class="truth"><strong>What these Scriptures establish</strong><p>${esc(item.truth)}</p></div>`}else body+=`<div class="note">Choose a concern above to see its Scripture selections.</div>`;
body+=field('other','Other Scripture','Enter another Scripture reference and the words or truth you want to remember…')+field('truth','What can I confidently trust God for?','What does Scripture actually promise, even if my circumstances do not change?')}
if(n===9)body=`<div class="kicker">Page 10 · Personal reflection · Step 4</div><h2>Respond in faith this week.</h2>${scripture('James 1:22')}${scripture('Philippians 4:6–7')}<p>Choose one specific step of trust or obedience you can practice in the next seven days.</p>${field('commitment','My seven-day commitment','When I become afraid about … I will remember … (Scripture: …). Therefore, this week I will …')}<div class="note">The goal is not to control the outcome. It is to respond faithfully to God.</div>`;
if(n===10){const chosen=state.selected.map(id=>{const [i,j]=id.split(':').map(Number);return LIB[i]?.verses[j]}).filter(Boolean);body=`<div class="kicker">Page 11 · Review and save</div><h2>Carry hope into the week ahead.</h2>${scripture('Romans 15:4')}${scripture('1 Thessalonians 5:11')}${scripture('Hebrews 10:24–25')}${field('person','Who could I encourage this week?','A person I can encourage with a Scripture or prayer…')}<hr class="divider"><h3>Your private study summary</h3><div class="review"><strong>My concern</strong><p>${esc(state.fear||'Not entered')}</p><strong>My beliefs</strong><p>${esc(state.beliefs||'Not entered')}</p><strong>My Scriptures</strong><p>${chosen.length?chosen.map(v=>v.ref).join('; '):'None selected'}${state.other?'\nOther: '+esc(state.other):''}</p><strong>God’s truth</strong><p>${esc(state.truth||'Not entered')}</p><strong>My commitment</strong><p>${esc(state.commitment||'Not entered')}</p></div><div class="actions"><button class="btn full" id="download">↓ Save my completed study as HTML</button><button class="btn outline full" id="email">✉ Email a copy to myself</button><button class="btn secondary full" id="print">Print / Save as PDF</button></div><p class="small">The downloaded HTML contains your answers and selected Scripture texts, and opens without internet. Email opens a draft in your email app and may send personal information through your email provider. Nothing is sent unless you choose to send it.</p>`}
document.getElementById('page').innerHTML=body;document.querySelectorAll('[data-score]').forEach(el=>el.addEventListener('change',()=>{state.scores[+el.dataset.score]=+el.value;save();render()}));document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.field]=el.value;save()}));document.getElementById('concern')?.addEventListener('change',e=>{state.concern=e.target.value===''?null:+e.target.value;state.selected=[];save()});document.querySelectorAll('[data-category]').forEach(el=>el.addEventListener('click',()=>{state.concern=+el.dataset.category;save();render()}));document.querySelectorAll('[data-verse]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.verse;state.selected=el.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);save()}));document.getElementById('download')?.addEventListener('click',download);document.getElementById('email')?.addEventListener('click',email);document.getElementById('print')?.addEventListener('click',()=>window.print());}
function go(delta){state.page=delta===99?0:Math.max(0,Math.min(10,state.page+delta));save();render();window.scrollTo(0,0)}document.getElementById('prev').addEventListener('click',()=>go(-1));document.getElementById('next').addEventListener('click',()=>go(state.page===10?99:1));
function report(){const picked=state.selected.map(id=>{const [i,j]=id.split(':').map(Number);return LIB[i]?.verses[j]}).filter(Boolean);return {picked,body:[['My concern',state.fear],['What I believe',state.beliefs],['Scripture references',picked.map(v=>v.ref).join('; ')],['Other Scripture',state.other],['What Scripture teaches me',state.truth],['Seven-day commitment',state.commitment],['Person to encourage',state.person]]}}
function download(){const r=report();const score=state.scores.every(Boolean)?state.scores.reduce((a,b)=>a+b,0)+'/25':'Not completed';const doc=`<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Gift of Hope and Optimism Study</title><style>body{font-family:Georgia,serif;line-height:1.7;max-width:750px;margin:35px auto;padding:0 20px;color:#173039}h1{color:#125e5d}section{border-bottom:1px solid #ddd;padding:14px 0;white-space:pre-wrap}strong{color:#126b69}.verse{background:#f0f5f2;padding:16px;border-radius:8px;margin:12px 0}</style><h1>The Gift of Hope and Optimism</h1><p>My private Bible study · Opening reflection score: ${esc(score)}</p>${r.body.map(([a,b])=>`<section><strong>${esc(a)}</strong><div>${esc(b||'—')}</div></section>`).join('')}<h2>Selected Scripture texts</h2>${r.picked.map(v=>`<div class="verse"><strong>${esc(v.ref)}</strong><p>${esc(v.text)}</p></div>`).join('')||'<p>No passages selected.</p>'}<p>Return to these Scriptures and your commitment during the coming week.</p></html>`;const url=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='my-hope-and-optimism-study.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);note('Your completed study is ready to save')}
function email(){const r=report();const body='The Gift of Hope and Optimism — My private study\n\n'+r.body.map(([k,v])=>k+'\n'+(v||'—')).join('\n\n')+'\n\nSelected Scripture texts:\n'+r.picked.map(v=>v.ref+'\n'+v.text).join('\n\n');const href='mailto:?subject='+encodeURIComponent('My Hope and Optimism Bible Study')+'&body='+encodeURIComponent(body);if(href.length>16000){note('Email is too long; save the HTML file instead');return}window.location.href=href}
render();
</script></body></html>
