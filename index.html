ore{background:#eef5f2;padding:16px;border-radius:12px;margin-top:16px}.score b{font-size:27px;color:var(--teal)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:14px 0}.category{font:inherit;text-align:right;padding:12px;background:#fff;border:1px solid #becdc8;border-radius:11px;cursor:pointer;color:var(--ink)}.category.active{border:2px solid var(--teal);background:#e7f2ee;font-weight:bold}.category span{color:var(--teal);margin-left:7px}.passage{background:#f9fbfa;border:1px solid var(--line);padding:14px;border-radius:11px;margin:11px 0}.passage label{display:flex;align-items:center;gap:10px;font-weight:bold;cursor:pointer}.passage input{width:20px;height:20px;accent-color:var(--teal)}.verse{white-space:pre-line;margin:8px 0 0;line-height:1.95}.picked li{margin:12px 0}.picked .verse{font-weight:normal}.summary{border-bottom:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.summary strong{color:var(--teal)}.btn{border:0;border-radius:11px;padding:13px 17px;background:var(--teal);color:white;font:inherit;font-weight:bold;cursor:pointer}.btn.secondary{background:#e8eeec;color:#24454b}.btn.outline{border:1px solid var(--teal);background:white;color:var(--teal)}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:grid;gap:10px;margin-top:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 15px max(12px,env(safe-area-inset-bottom))}.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav span{font-size:12px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:90px;right:15px;left:15px;margin:auto;max-width:500px;background:#17343a;color:white;border-radius:10px;padding:12px;display:none;text-align:center}footer{color:var(--muted);font-size:12px;text-align:center;margin:20px 0}@media print{header,.nav,.actions,.track,.meta{display:none!important}main{padding:0}.sheet{box-shadow:none;border:0}}@media(max-wi </style></head><body><header><div class="inner"><div class="eyebrow">קהילת שערי תהילה</div><h1>אופטימיות ותקווה</h1><p>תרגול אישי במהלך המסר · התשובות נשארות במכשיר שלכם</p></div></header><main><div class="meta"><span id="pageNum"></span><span id="sectionName"></span></div><div class="track"><span id="bar"></span></div><article class="sheet" id="page" aria-live="polite"></article><footer>הטקסטים ללימוד מופיעים במצגת. כאן עונים, בוחרים ושומרים את התרגול האישי.</footer></main><nav class="nav"><div class="nav-inner"><button class="btn secondary" id="prev" type="button">→ הקודם</button><span>עברו לשלב הבא לפי הנחיית הדובר</span><button class="btn" id="next" type="button">הבא ←</button></div></nav><div id="toast" class="toast" role="status"></div><script>
const LIB=[{"name": "קשיים כלכליים", "verses": [{"ref": "מתי 6:31–33", "text": "לָכֵן אַל תִּדְאֲגוּ לֵאמֺר: מָה נֺּאכַל? מָה נִּשְׁתֶּה? וּמָה נִּלְבַּשׁ?\nהֵן אֶת כָּל אֵלֶּה מְבַקְּשִׁים הַגּוֹיִים, וַהֲרֵי אֲבִיכֶם שֶׁבַּשָּׁמַיִם יוֹדֵעַ שֶׁזְּקוּקִים אַתֶּם לְכָל אֵלֶּה.\nאַתֶּם בַּקְּשׁוּ תְּחִלָּה אֶת מַלְכוּתוֹ וְאֶת צִדְקָתוֹ, וְכָל אֵלֶּה יִוָּסְפוּ לָכֶם."}, {"ref": "אל הפיליפים 4:12–13", "text": "יוֹדֵעַ אֲנִי לַעֲמֺד בְּעֺנִי, וְיוֹדֵעַ אֲנִי לַעֲמֺד בְּשֶׁפַע. בְּכָל דָּבָר וּבְכָל הַנְּסִבּוֹת מֻרְגָּל אֲנִי גַּם לְשֺׂבַע וְגַם לְרָעָב, גַּם לְשֶׁפַע גַּם לְמַחְסוֹר.\nהַכֺּל אֲנִי יָכוֹל בְּעֶזְרָתוֹ שֶׁל הַנּוֹתֵן בִּי כֺּחַ."}]}, {"name": "עבודה ופרנסה", "verses": [{"ref": "אל הקולוסים 3:23–24", "text": "כָּל מָה שֶׁאַתֶּם עוֹשִׂים, עֲשׂוּ בְּכָל נַפְשְׁכֶם, כְּעוֹשִׂים לְמַעַן הָאָדוֹן וְלֹא לְמַעַן בְּנֵי אָדָם,\nשֶׁכֵּן יוֹדְעִים אַתֶּם כִּי תְּקַבְּלוּ מֵאֵת הָאָדוֹן אֶת שְׂכַר הַנַּחֲלָה. אֶת הָאָדוֹן הַמָּשִׁיחַ אַתֶּם עוֹבְדִים!"}, {"ref": "אל הפיליפים 4:6–7", "text": "אַל תִּדְאֲגוּ לְשׁוּם דָּבָר, כִּי אִם בְּכָל דָּבָר הַצִּיגוּ מִשְׁאֲלוֹתֵיכֶם לֶאֱלֹהִים בִּתְפִלָּה וּבְתַחֲנוּנִים וּבְהוֹדָיָה.\nוּשְׁלוֹם אֱלֹהִים הַנִּשְׂגָּב מִכָּל שֵׂכֶל יִנְצֺר אֶת לְבַבְכֶם וְאֶת מַחְשְׁבוֹתֵיכֶם בַּמָּשִׁיחַ יֵשׁוּעַ."}]}, {"name": "ביטחון כלכלי בעתיד", "verses": [{"ref": "הראשונה אל טימותיאוס 6:17", "text": "צַוֵּה אֶת עֲשִׁירֵי הָעוֹלָם הַזֶּה שֶׁלֹּא יָרוּם לְבָבָם וְלֹא יִבְטְחוּ בָּעֺשֶׁר שֶׁאֵין בּוֹ בִּטָּחוֹן, אֶלָּא בֶּאֱלֹהִים הַמַּעֲנִיק לָנוּ אֶת הַכֺּל בְּשֶׁפַע לַהֲנָאָתֵנוּ."}, {"ref": "אל העברים 13:5", "text": "רַחֲקוּ מֵאַהֲבַת כֶּסֶף וְשִׂמְחוּ בְּחֶלְקְכֶם, כִּי הוּא אָמַר, \"לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ\"."}]}, {"name": "ילדים ונכדים", "verses": [{"ref": "דברים 6:6–7", "text": "וְהָי֞וּ הַדְּבָרִ֣ים הָאֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּךָ֛ הַיּ֖וֹם עַל־לְבָבֶֽךָ׃\nוְשִׁנַּנְתָּ֣ם לְבָנֶ֔יךָ וְדִבַּרְתָּ֖ בָּ֑ם בְּשִׁבְתְּךָ֤ בְּבֵיתֶ֨ךָ֙ וּבְלֶכְתְּךָ֣ בַדֶּ֔רֶךְ וּֽבְשָׁכְבְּךָ֖ וּבְקוּמֶֽךָ׃"}, {"ref": "אל הפיליפים 4:6–7", "text": "אַל תִּדְאֲגוּ לְשׁוּם דָּבָר, כִּי אִם בְּכָל דָּבָר הַצִּיגוּ מִשְׁאֲלוֹתֵיכֶם לֶאֱלֹהִים בִּתְפִלָּה וּבְתַחֲנוּנִים וּבְהוֹדָיָה.\nוּשְׁלוֹם אֱלֹהִים הַנִּשְׂגָּב מִכָּל שֵׂכֶל יִנְצֺר אֶת לְבַבְכֶם וְאֶת מַחְשְׁבוֹתֵיכֶם בַּמָּשִׁיחַ יֵשׁוּעַ."}]}, {"name": "זוגיות וסכסוכים במשפחה", "verses": [{"ref": "אל הרומים 12:18", "text": "עַד כַּמָּה שֶׁהַדָּבָר בְּיֶדְכֶם חֲיוּ בְּשָׁלוֹם עִם כָּל אָדָם."}, {"ref": "אל האפסים 4:32", "text": "הֱיוּ טוֹבִים אִישׁ לְרֵעֵהוּ; הֱיוּ מְלֵאֵי רַחֲמִים וְסִלְחוּ אִישׁ לְרֵעֵהוּ כְּשֵׁם שֶׁאֱלֹהִים סָלַח לָכֶם בַּמָּשִׁיחַ."}]}, {"name": "בדידות ודחייה", "verses": [{"ref": "אל העברים 13:5–6", "text": "רַחֲקוּ מֵאַהֲבַת כֶּסֶף וְשִׂמְחוּ בְּחֶלְקְכֶם, כִּי הוּא אָמַר, \"לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ\".\nעַל כֵּן נִבְטַח וְנֺאמַר, \"יהוה לִי בְּעֺזְרָי, לֹא אִירָא מַה־יַּעֲשֶׂה לִי אָדָם\"."}, {"ref": "אל הרומים 8:38–39", "text": "וַאֲנִי בָּטוּחַ כִּי לֹא הַמָּוֶת וְלֹא הַחַיִּים, לֹא מַלְאָכִים וְלֹא שַׁלִּיטִים, לֹא דְּבָרִים שֶׁבַּהֺוֶה וְלֹא דְּבָרִים שֶׁעֲתִידִים לָבוֹא, לֹא כֺּחוֹת,\nלֹא גְּבָהִים וְלֹא מַעֲמַקִּים וְלֹא שׁוּם יְצוּר אַחֵר לֹא יוּכְלוּ לְהַפְרִיד אוֹתָנוּ מֵאַהֲבַת אֱלֹהִים שֶׁבַּמָּשִׁיחַ יֵשׁוּעַ אֲדוֹנֵנוּ."}]}, {"name": "הורים מזדקנים וטיפול בהם", "verses": [{"ref": "הראשונה אל טימותיאוס 5:4", "text": "וְאִם לְאַלְמָנָה יֵשׁ בָּנִים אוֹ בְּנֵי בָּנִים, עֲלֵיהֶם קֺדֶם כֺּל לִלְמֺד לַעֲשׂוֹת חֶסֶד עִם בֵּיתָם הֵם וּלְהָשִׁיב גְּמוּל לְהוֹרֵיהֶם, כִּי כֵן רָצוּי לִפְנֵי אֱלֹהִים."}, {"ref": "אגרת יעקב 1:5", "text": "אִישׁ מִכֶּם אִם יֶחְסַר חָכְמָה, יְבַקֵּשׁ מֵאֱלֹהִים הַנּוֹתֵן לַכֺּל בִּנְדִיבוּת וּבְלֹא גְּעָרָה, וְתִנָּתֵן לוֹ."}]}, {"name": "בריאות אישית", "verses": [{"ref": "השנייה אל הקורינתים 12:9", "text": "אַךְ הוּא אָמַר לִי: \"דַּי לְךָ חַסְדִּי, כִּי בַּחֻלְשָׁה תֻּשְׁלַם גְּבוּרָתִי\". עַל כֵּן בְּשִׂמְחָה רַבָּה אֶתְגָּאֶה בְּחֻלְשׁוֹתַי, כְּדֵי שֶׁתִּשְׁרֶה עָלַי גְּבוּרַת הַמָּשִׁיחַ."}, {"ref": "אל הרומים 8:23", "text": "וְלֹא זוֹ בִּלְבַד, אֶלָּא גַּם אֲנַחְנוּ, שֶׁיֵּשׁ לָנוּ בִּכּוּרֵי הָרוּחַ, נֶאֱנָחִים בְּנַפְשֵׁנוּ וּמְצַפִּים לְמִמּוּשׁ אִמּוּצֵנוּ לְבָנִים – לִפְדוּת גּוּפֵנוּ,"}]}, {"name": "חרדה, ייאוש ותשישות", "verses": [{"ref": "הראשונה של כיפא 5:7", "text": "הַשְׁלִיכוּ עָלָיו כָּל דַּאֲגַתְכֶם, כִּי הוּא דּוֹאֵג לָכֶם."}, {"ref": "תהלים 42:6", "text": "מַה־תִּשְׁתּ֬וֹחֲחִ֨י ׀ נַפְשִׁי֮ וַתֶּהֱמִ֪י עָ֫לָ֥י הוֹחִ֣ילִי לֵֽ֭אלֹהִים כִּי־ע֥וֹד אוֹדֶ֗נּוּ יְשׁוּע֥וֹת פָּנָֽיו׃"}]}, {"name": "מלחמה וסכנה גופנית", "verses": [{"ref": "תהלים 46:2–3", "text": "אֱלֹהִ֣ים לָ֭נוּ מַחֲסֶ֣ה וָעֹ֑ז עֶזְרָ֥ה בְ֝צָר֗וֹת נִמְצָ֥א מְאֹֽד׃\nעַל־כֵּ֣ן לֹא־נִ֭ירָא בְּהָמִ֣יר אָ֑רֶץ וּבְמ֥וֹט הָ֝רִ֗ים בְּלֵ֣ב יַמִּֽים׃"}, {"ref": "תהלים 56:4–5", "text": "י֥וֹם אִירָ֑א אֲ֝נִ֗י אֵלֶ֥יךָ אֶבְטָֽח׃\nבֵּאלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥וֹ בֵּאלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה־יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽי׃"}]}, {"name": "אובדן ואבל", "verses": [{"ref": "הראשונה אל התסלוניקים 4:13–14", "text": "אַחַי, אֵין אָנוּ רוֹצִים שֶׁיֵּעָלֵם מִכֶּם מָה שֶּׁנּוֹגֵעַ לִישֵׁנֵי עָפָר, כְּדֵי שֶׁלֹּא תִּתְעַצְּבוּ כַּאֲחֵרִים אֲשֶׁר אֵין לָהֶם תִּקְוָה.\nאִם אָמְנָם מַאֲמִינִים אָנוּ שֶׁיֵּשׁוּעַ מֵת וְקָם לִתְחִיָּה, כָּךְ אֱלֹהִים יָבִיא יַחַד אִתּוֹ גַּם אֶת הַיְּשֵׁנִים, בְּאֶמְצָעוּת יֵשׁוּעַ."}, {"ref": "יוחנן 11:25–26", "text": "אָמַר לָהּ יֵשׁוּעַ: \"אֲנִי הַתְּחִיָּה וְהַחַיִּים. הַמַּאֲמִין בִּי יִחְיֶה גַּם אִם יָמוּת.\nוְכָל מִי שֶׁחַי וּמַאֲמִין בִּי לֹא יָמוּת לְעוֹלָם. הַאִם מַאֲמִינָה אַתְּ בָּזֶה\"?"}]}, {"name": "סבל מתמשך", "verses": [{"ref": "אל הרומים 8:18", "text": "אֲנִי סָבוּר שֶׁסִּבְלוֹת הַזְּמַן הַזֶּה אֵינָם שְׁקוּלִים כְּנֶגֶד הַכָּבוֹד הֶעָתִיד לְהִגָּלוֹת בָּנוּ."}, {"ref": "התגלות 21:4", "text": "הָרִאשׁוֹנוֹת עָבְרוּ\"."}]}, {"name": "פחד מכישלון", "verses": [{"ref": "הראשונה אל הקורינתים 15:58", "text": "עַל כֵּן, אַחַי הָאֲהוּבִים, עִמְדוּ הֵיטֵב וֶהֱיוּ יַצִּיבִים; הֱיוּ תָּמִיד עֲתִירֵי פֺּעַל בַּעֲבוֹדָתוֹ שֶׁל הָאָדוֹן, בִּידִיעָה שֶׁעֲמַלְכֶם אֵינֶנּוּ לָרִיק בָּאָדוֹן."}, {"ref": "מרקוס 8:36", "text": "מָה תּוֹעֶלֶת תִּצְמַח לְאָדָם אִם יַרְוִיחַ אֶת כָּל הָעוֹלָם וְיַפְסִיד אֶת נַפְשׁוֹ?"}]}, {"name": "החלטות חשובות וחוסר ודאות", "verses": [{"ref": "אגרת יעקב 1:5", "text": "אִישׁ מִכֶּם אִם יֶחְסַר חָכְמָה, יְבַקֵּשׁ מֵאֱלֹהִים הַנּוֹתֵן לַכֺּל בִּנְדִיבוּת וּבְלֹא גְּעָרָה, וְתִנָּתֵן לוֹ."}, {"ref": "משלי 3:5–6", "text": "בְּטַ֣ח אֶל־יְ֭הוָה בְּכָל־לִבֶּ֑ךָ וְאֶל־בִּֽ֝ינָתְךָ֗ אַל־תִּשָּׁעֵֽן׃\nבְּכָל־דְּרָכֶ֥יךָ דָעֵ֑הוּ וְ֝ה֗וּא יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽיךָ׃"}]}, {"name": "תכלית ומשמעות", "verses": [{"ref": "אל האפסים 2:10", "text": "שֶׁהֲרֵי מַעֲשֵׂה יְדֵי אֱלֹהִים אֲנַחְנוּ, בְּרוּאִים בַּמָּשִׁיחַ יֵשׁוּעַ לְמַעֲשִׂים טוֹבִים אֲשֶׁר אֱלֹהִים הֵכִינָם מִקֶּדֶם לְמַעַן נִתְהַלֵּךְ בָּהֶם."}, {"ref": "אל הקולוסים 1:16", "text": "כִּי בּוֹ נִבְרָא כָּל אֲשֶׁר בַּשָּׁמַיִם וַאֲשֶׁר בָּאָרֶץ, מָה שֶׁנִּרְאֶה וּמָה שֶׁבִּלְתִּי נִרְאֶה, גַּם כִּסְאוֹת וְרָשֻׁיּוֹת וְגַם מֶמְשָׁלוֹת וְשִׁלְטוֹנוֹת. הַכֺּל נִבְרָא בְּאֶמְצָעוּתוֹ וּלְמַעֲנוֹ,"}]}, {"name": "הזדקנות ומוות", "verses": [{"ref": "תהלים 90:12", "text": "לִמְנ֣וֹת יָ֭מֵינוּ כֵּ֣ן הוֹדַ֑ע וְ֝נָבִ֗א לְבַ֣ב חָכְמָֽה׃"}, {"ref": "יוחנן 11:25–26", "text": "אָמַר לָהּ יֵשׁוּעַ: \"אֲנִי הַתְּחִיָּה וְהַחַיִּים. הַמַּאֲמִין בִּי יִחְיֶה גַּם אִם יָמוּת.\nוְכָל מִי שֶׁחַי וּמַאֲמִין בִּי לֹא יָמוּת לְעוֹלָם. הַאִם מַאֲמִינָה אַתְּ בָּזֶה\"?"}]}, {"name": "חרטות וטעויות העבר", "verses": [{"ref": "הראשונה של יוחנן 1:9", "text": "אִם נִתְוַדֶּה עַל חֲטָאֵינוּ, נֶאֱמָן הוּא וְצַדִּיק כְּדֵי לִסְלֹחַ לָנוּ עַל חֲטָאֵינוּ וּלְטַהֵר אוֹתָנוּ מִכָּל עַוְלָה."}, {"ref": "אל הרומים 8:1", "text": "לָכֵן אֵין עַכְשָׁו שׁוּם הַרְשָׁעָה עַל אֵלֶּה שֶׁנִּמְצָאִים בַּמָּשִׁיחַ יֵשׁוּעַ ,"}]}, {"name": "שינויים ואובדן שליטה", "verses": [{"ref": "אגרת יעקב 4:13–15", "text": "הוֹי הָאוֹמְרִים, \"הַיּוֹם אוֹ מָחָר נֵלֵךְ לְעִיר פְּלוֹנִית, נַעֲשֶׂה שָׁם שָׁנָה אַחַת, נִסְחַר וְנַעֲשֶׂה הוֹן,\"\nוְאֵינְכֶם יוֹדְעִים מָה יֵלֵד יוֹם. מָה הֵם חַיֵּיכֶם? הֲלֹא אֵד אַתֶּם, הַנִּרְאֶה לְרֶגַע וְאַחַר כָּךְ נֶעְלָם.\nרָאוּי הָיָה שֶׁתֺּאמְרוּ, \"אִם יִרְצֶה הָאָדוֹן, נִחְיֶה וְנַעֲשֶׂה כָּזֺאת וְכָזֺאת\"."}, {"ref": "אל העברים 13:8", "text": "יֵשׁוּעַ הַמָּשִׁיחַ הוּא הוּא – אֶתְמוֹל, הַיּוֹם וּלְעוֹלָמִים."}]}, {"name": "חולשה רוחנית או ספק", "verses": [{"ref": "מרקוס 9:24", "text": "מִיָּד צָעַק אֲבִי הַיֶּלֶד וְאָמַר: \"מַאֲמִין אֲנִי, עֲזֺר נָא לִי בְּחֶסְרוֹן אֱמוּנָתִי\"!"}, {"ref": "אל העברים 4:15–16", "text": "כִּי אֵין לָנוּ כֺּהֵן גָּדוֹל שֶׁאֵינוֹ יָכוֹל לָחוּשׁ עִמָּנוּ אֶת חֻלְשׁוֹתֵינוּ, אֶלָּא אֶחָד שֶׁהִתְנַסָּה בַּכֺּל כָּמוֹנוּ מִבְּלִי חֵטְא.\nעַל כֵּן נִקְרְבָה בְּבִטָּחוֹן אֶל כֵּס הַחֶסֶד לְקַבֵּל רַחֲמִים וְלִמְצֺא חֶסֶד לְעֶזְרָה בְּעִתָּהּ."}]}, {"name": "פיתוי וחטא חוזר", "verses": [{"ref": "הראשונה אל הקורינתים 10:13", "text": "שׁוּם נִסָּיוֹן לֹא בָּא עֲלֵיכֶם מִלְּבַד נִסָּיוֹן אֱנוֹשִׁי רָגִיל. נֶאֱמָן הוּא הָאֱלֹהִים וְלֹא יַנִּיחַ לָכֶם לְהִתְנַסּוֹת לְמַעְלָה מִיכָלְתְּכֶם, אֶלָּא עִם הַנִּסָּיוֹן יָכִין גַּם אֶת דֶּרֶךְ הַמּוֹצָא כְּדֵי שֶׁתּוּכְלוּ לַעֲמֺד בּוֹ."}, {"ref": "הראשונה של יוחנן 2:1", "text": "יְלָדַי, כּוֹתֵב אֲנִי לָכֶם אֶת הַדְּבָרִים הָאֵלֶּה לְמַעַן לֹא תֶּחֶטְאוּ; וְאִם יֶחֱטָא אִישׁ יֵשׁ לָנוּ מֵלִיץ לִפְנֵי הָאָב, יֵשׁוּעַ הַמָּשִׁיחַ, הַצַּדִּיק."}]}, {"name": "התנגדות בגלל האמונה", "verses": [{"ref": "יוחנן 16:33", "text": "אָמַרְתִּי לָכֶם אֶת הַדְּבָרִים הָאֵלֶּה כְּדֵי שֶׁבִּי יִהְיֶה לָכֶם שָׁלוֹם. בָּעוֹלָם – צָרָה לָכֶם, אַךְ הִתְעוֹדְדוּ: אֲנִי נִצַּחְתִּי אֶת הָעוֹלָם\"."}, {"ref": "הראשונה של כיפא 4:14", "text": "אַשְׁרֵיכֶם אִם יְחָרְפוּ אֶתְכֶם בַּעֲבוּר שֵׁם הַמָּשִׁיחַ, כִּי אָז רוּחַ הַכָּבוֹד , רוּחַ אֱלֹהִים , נָחָה עֲלֵיכֶם."}]}, {"name": "אנשים יקרים שאינם מאמינים", "verses": [{"ref": "הראשונה אל טימותיאוס 2:3–4", "text": "טוֹב הַדָּבָר הַזֶּה וְרָצוּי בְּעֵינֵי אֱלֹהִים מוֹשִׁיעֵנוּ,\nהֶחָפֵץ שֶׁכָּל בְּנֵי אָדָם יִוָּשְׁעוּ וְיַגִּיעוּ לְהַכָּרַת הָאֱמֶת."}, {"ref": "אל הרומים 10:13–14", "text": "שֶׁכֵּן \"כֺּל אֲשֶׁר־יִקְרָא בְּשֵׁם יהוה יִוָּשַׁע\".\nאַךְ כֵּיצַד יִקְרְאוּ אֶל מִי שֶׁלֹּא הֶאֱמִינוּ בּוֹ? וְכֵיצַד יַאֲמִינוּ בָּזֶה אֲשֶׁר לֹא שָׁמְעוּ אוֹתוֹ? וְכֵיצַד יִשְׁמְעוּ בְּאֵין מְבַשֵּׂר?"}]}];

function chosen(){return state.selected.map(id=>{const [i,j]=id.split(':').map(Number);return LIB[i]?.verses[j]}).filter(Boolean)}
function render(){const n=state.page;document.getElementById('pageNum').textContent=`עמוד ${n+1} מתוך 6`;document.getElementById('sectionName').textContent=TITLES[n];document.getElementById('bar').style.width=((n+1)/6*100)+'%';document.getElementById('prev').disabled=n===0;document.getElementById('next').textContent=n===5?'חזרה להתחלה ↺':'הבא ←';let body='';
if(n===0){const done=state.scores.filter(Boolean).length,total=state.scores.reduce((a,b)=>a+b,0);body=`<h2>איך אתם בדרך כלל מסתכלים על העתיד?</h2><p class="muted">בחרו מספר מ־1 (בכלל לא מסכים) עד 5 (מסכים מאוד) לכל משפט. זהו תרגיל לחשיבה אישית, לא מבחן אמונה.</p>`+QUESTIONS.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q)}</h3><div class="scale">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="score${i}" value="${v}" data-score="${i}" ${state.scores[i]===v?'checked':''}><div>${v}</div></label>`).join('')}</div><div class="scaleLegend"><span>בכלל לא מסכים</span><span>מסכים מאוד</span></div></div>`).join('')+`<div class="score"><span>נענו ${done} מתוך 5 שאלות</span><br><b>${done===5?total+' / 25':'—'}</b><p>${done<5?'ענו על כל השאלות כדי לראות את התוצאה.':total<=11?'התגובות שלכם נוטות להשקפה פסימית יותר.':total<=18?'התגובות שלכם משקפות השקפה מעורבת או זהירה.':'התגובות שלכם נוטות להשקפה אופטימית יותר.'}</p><p class="small">טווחי הציונים נועדו להמחשה בלבד ואינם מבוססים על שאלון מחקרי מאומת.</p></div>`}
if(n===1)body=`<h2>מה הכי מדאיג אותי?</h2><p>חשבו על פחד, דאגה או חוסר ודאות אמיתיים לגבי העתיד. כתבו מה בדיוק אתם חוששים שיקרה. בהמשך תוכלו לבחור נושאים ופסוקים שמתאימים למצב שלכם.</p>${field('fear','מה הפחד או הדאגה המרכזיים שלי?')}<div class="note">התשובות אינן נשלחות לדובר או לקהילה.</div>`;
if(n===2)body=`<h2>מה אני מאמין לגבי אלוהים והעתיד שלי?</h2><p>התבוננו בדאגה שכתבתם. מה ידוע לכם כעובדה, ומהו חשש או הנחה? האם יש מחשבה על אלוהים שצריך לבחון לאור דברו?</p>${state.fear?`<div class="panel"><strong>הדאגה שכתבתי:</strong><p>${esc(state.fear)}</p></div>`:''}${field('beliefs','מה אני מאמין על אלוהים, על נאמנותו או על העתיד שלי?')}`;
if(n===3){body=`<h2>בחרו את הדאגות והפסוקים המתאימים לכם</h2><p>אפשר לבחור כמה נושאים. לאחר הבחירה יופיעו שני פסוקים לכל נושא. סמנו רק את הפסוקים שאתם רוצים לשמור ולחזור אליהם.</p><div class="groups">${LIB.map((x,i)=>`<button type="button" class="category ${state.concerns.includes(i)?'active':''}" data-category="${i}" aria-pressed="${state.concerns.includes(i)}"><span>${state.concerns.includes(i)?'✓':i+1+'.'}</span>${esc(x.name)}</button>`).join('')}</div>`;if(state.concerns.length)body+=state.concerns.map(i=>`<section class="panel"><h3>${esc(LIB[i].name)}</h3>${LIB[i].verses.map((v,j)=>{const id=i+':'+j;return `<div class="passage"><label><input type="checkbox" data-verse="${id}" ${state.selected.includes(id)?'checked':''}> ${esc(v.ref)} — לשמור את הפסוק</label><p class="verse">${esc(v.text)}</p></div>`}).join('')}</section>`).join('');else body+='<div class="note">בחרו נושא אחד או יותר כדי לראות את הפסוקים.</div>';body+=field('other','פסוק נוסף (רשות)','אפשר לכתוב כאן הפניה או מחשבה מפסוק אחר...')+field('truth','מה אני יכול לבטוח באלוהים שיעשה, לפי הכתובים?','כתבו מה הכתובים באמת מבטיחים, גם אם הנסיבות לא ישתנו...')}
if(n===4){const names=state.concerns.map(i=>LIB[i]?.name).filter(Boolean);const verses=chosen();body=`<h2>מה אעשה בשבעת הימים הקרובים?</h2><p>בחרו צעד אחד מעשי של אמונה או ציות שתוכלו ליישם השבוע.</p><div class="note">כשאדאג לגבי <strong>${names.length?names.map(esc).join('، '):'הדברים שמטרידים אותי'}</strong>, אזכור את דבר אלוהים:</div><ul class="picked">${verses.map(v=>`<li><strong>${esc(v.ref)}</strong><p class="verse">${esc(v.text)}</p></li>`).join('')||'<li>עדיין לא נבחרו פסוקים. אפשר לחזור לעמוד 4 ולבחור.</li>'}${state.other?`<li>${esc(state.other)}</li>`:''}</ul>${field('commitment','לכן, השבוע אני מתחייב/ת ל...','כתבו פעולה אחת ברורה שאפשר לבצע בשבוע הקרוב...')}<p class="small">המטרה אינה לשלוט בתוצאה, אלא להגיב בנאמנות לאלוהים.</p>`}
if(n===5){const names=state.concerns.map(i=>LIB[i]?.name).filter(Boolean),verses=chosen();body=`<h2>בדקו ושמרו את התרגול האישי</h2><p>עברו על התשובות שלכם. אפשר לחזור לכל עמוד ולערוך אותן.</p><div class="summary"><strong>השאלון</strong><p>${state.scores.every(Boolean)?state.scores.reduce((a,b)=>a+b,0)+' מתוך 25':'לא הושלם'}</p></div><div class="summary"><strong>הדאגה שלי</strong><p>${esc(state.fear||'לא נכתב')}</p></div><div class="summary"><strong>מה אני מאמין</strong><p>${esc(state.beliefs||'לא נכתב')}</p></div><div class="summary"><strong>הנושאים שבחרתי</strong><p>${names.map(esc).join('، ')||'לא נבחרו'}</p></div><div class="summary"><strong>הפסוקים שבחרתי</strong><ul class="picked">${verses.map(v=>`<li><strong>${esc(v.ref)}</strong><p class="verse">${esc(v.text)}</p></li>`).join('')||'<li>לא נבחרו</li>'}</ul></div><div class="summary"><strong>מחשבה נוספת</strong><p>${esc(state.other||'—')}</p></div><div class="summary"><strong>מה הכתובים מלמדים אותי</strong><p>${esc(state.truth||'—')}</p></div><div class="summary"><strong>ההתחייבות שלי לשבוע הקרוב</strong><p>${esc(state.commitment||'לא נכתב')}</p></div><div class="actions"><button class="btn" id="download" type="button">↓ שמירת התרגול כקובץ HTML</button><button class="btn outline" id="email" type="button">שליחה לעצמי בדוא״ל</button><button class="btn secondary" id="print" type="button">הדפסה / שמירה כ־PDF</button></div><div class="note small">הקובץ שיורד למכשיר מכיל את התשובות האישיות והפסוקים שנבחרו, ואפשר לפתוח אותו גם בלי אינטרנט. שליחה בדוא״ל עשויה לחשוף את התשובות לספק הדוא״ל. שום דבר לא נשלח אוטומטית.</div>`}
document.getElementById('page').innerHTML=body;document.querySelectorAll('[data-score]').forEach(el=>el.addEventListener('change',()=>{state.scores[+el.dataset.score]=+el.value;save();render()}));document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.field]=el.value;save()}));document.querySelectorAll('[data-category]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.category;state.concerns=state.concerns.includes(i)?state.concerns.filter(x=>x!==i):[...state.concerns,i].sort((a,b)=>a-b);state.selected=state.selected.filter(id=>state.concerns.includes(+id.split(':')[0]));save();render()}));document.querySelectorAll('[data-verse]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.verse;state.selected=el.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);save()}));document.getElementById('download')?.addEventListener('click',download);document.getElementById('email')?.addEventListener('click',email);document.getElementById('print')?.addEventListener('click',()=>window.print())}
function go(d){state.page=d===99?0:Math.min(5,Math.max(0,state.page+d));save();render();window.scrollTo(0,0)}document.getElementById('prev').addEventListener('click',()=>go(-1));document.getElementById('next').addEventListener('click',()=>go(state.page===5?99:1));
function report(){const names=state.concerns.map(i=>LIB[i]?.name).filter(Boolean);return [['תוצאת השאלון',state.scores.every(Boolean)?state.scores.reduce((a,b)=>a+b,0)+'/25':'לא הושלם'],['הדאגה שלי',state.fear],['מה אני מאמין',state.beliefs],['נושאים',names.join(', ')],['פסוקים נבחרים',chosen().map(v=>v.ref).join('; ')],['פסוק נוסף',state.other],['מה הכתובים מלמדים אותי',state.truth],['ההתחייבות שלי לשבוע',state.commitment]]}
function download(){const entries=report();const doc=`<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>התרגול האישי שלי — אופטימיות ותקווה</title><style>body{font-family:Arial,sans-serif;line-height:1.9;max-width:760px;margin:30px auto;padding:0 18px;color:#17343a}h1{color:#116c6b}.item{padding:12px 0;border-bottom:1px solid #ddd;white-space:pre-wrap}.verse{padding:14px;background:#eef5f2;border-radius:10px;margin:12px 0;white-space:pre-line}</style><h1>אופטימיות ותקווה — התרגול האישי שלי</h1>${entries.map(([k,v])=>`<div class="item"><strong>${esc(k)}</strong><div>${esc(v||'—')}</div></div>`).join('')}<h2>הפסוקים שבחרתי</h2>${chosen().map(v=>`<div class="verse"><strong>${esc(v.ref)}</strong><p>${esc(v.text)}</p></div>`).join('')||'<p>לא נבחרו פסוקים.</p>'}</html>`;const u=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='my-optimism-and-hope-study.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500);note('הקובץ מוכן לשמירה במכשיר')}
function email(){const b=report().map(([k,v])=>k+'\n'+(v||'—')).join('\n\n')+'\n\n'+chosen().map(v=>v.ref+'\n'+v.text).join('\n\n');const href='mailto:?subject='+encodeURIComponent('התרגול האישי שלי — אופטימיות ותקווה')+'&body='+encodeURIComponent(b);if(href.length>16000){note('ההודעה ארוכה מדי. שמרו את קובץ ה־HTML במקום זאת.');return}window.location.href=href}
render();
</script></body></html>
