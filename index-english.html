<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17343a"><title>Optimism and Hope | Personal exercise</title><style>
:root{--ink:#1c3740;--muted:#5e7074;--teal:#176b69;--gold:#c39b58;--paper:#f6f4ef;--line:#dbe3e0;--soft:#eaf3f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;line-height:1.7}header{background:#17343a;color:white;padding:22px 20px 24px}header .inner,main,.nav-inner{max-width:760px;margin:auto}.eyebrow{color:#e5c994;font-size:13px;letter-spacing:.4px}h1{font-size:clamp(28px,6vw,40px);margin:5px 0 0}header p{margin:0;color:#d5e1df;font-size:14px}main{padding:20px 16px 130px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:bold;font-size:13px}.track{height:7px;border-radius:20px;background:#dce7e3;overflow:hidden;margin:9px 0 20px}.track span{display:block;height:100%;background:var(--teal);transition:width .2s}.sheet{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 6px 22px #163b3410}h2{font-size:clamp(23px,5vw,31px);line-height:1.35;margin:0 0 10px}h3{font-size:18px;margin:18px 0 10px}p{margin:10px 0}.muted,.small{color:var(--muted)}.small{font-size:13px}.question,.panel{border:1px solid var(--line);border-radius:12px;padding:15px;margin:14px 0;background:#fcfdfc}.question h3{margin:0 0 12px;font-size:16px}.scale{display:flex;gap:7px;justify-content:space-between}.scale label{flex:1;text-align:center;border:1px solid #d5e0dc;border-radius:9px;padding:8px 2px;cursor:pointer}.scale input{accent-color:var(--teal);width:18px;height:18px}.scaleLegend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.field{display:block;font-weight:bold;margin:19px 0 7px}textarea{width:100%;min-height:115px;border:1px solid #b7c9c4;border-radius:11px;font:inherit;padding:12px;resize:vertical;direction:ltr}textarea:focus,button:focus-visible{outline:3px solid #a7d5c8;outline-offset:2px}.note{background:var(--soft);border-left:4px solid var(--teal);border-radius:10px;padding:14px;margin:15px 0}.score{background:#eef5f2;padding:16px;border-radius:12px;margin-top:16px}.score b{font-size:27px;color:var(--teal)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:14px 0}.category{font:inherit;text-align:left;padding:12px;background:#fff;border:1px solid #becdc8;border-radius:11px;cursor:pointer;color:var(--ink)}.category.active{border:2px solid var(--teal);background:#e7f2ee;font-weight:bold}.category span{color:var(--teal);margin-right:7px}.passage{background:#f9fbfa;border:1px solid var(--line);padding:14px;border-radius:11px;margin:11px 0}.passage label{display:flex;align-items:center;gap:10px;font-weight:bold;cursor:pointer}.passage input{width:20px;height:20px;accent-color:var(--teal)}.verse{white-space:pre-line;margin:8px 0 0;line-height:1.95}.picked li{margin:12px 0}.picked .verse{font-weight:normal}.summary{border-bottom:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.summary strong{color:var(--teal)}.btn{border:0;border-radius:11px;padding:13px 17px;background:var(--teal);color:white;font:inherit;font-weight:bold;cursor:pointer}.btn.secondary{background:#e8eeec;color:#24454b}.btn.outline{border:1px solid var(--teal);background:white;color:var(--teal)}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:grid;gap:10px;margin-top:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 15px max(12px,env(safe-area-inset-bottom))}.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav span{font-size:12px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:90px;left:15px;right:15px;margin:auto;max-width:500px;background:#17343a;color:white;border-radius:10px;padding:12px;display:none;text-align:center}footer{color:var(--muted);font-size:12px;text-align:center;margin:20px 0}@media print{header,.nav,.actions,.track,.meta{display:none!important}main{padding:0}.sheet{box-shadow:none;border:0}}@media(max-width:400px){.nav span{display:none}.btn{padding:11px}}
</style></head><body><header><div class="inner"><div class="eyebrow">Kehilat Sha’arei Tehilla</div><h1>Optimism and Hope</h1><p>A personal exercise during the message · Your answers stay on your device</p></div></header><main><div class="meta"><span id="pageNum"></span><span id="sectionName"></span></div><div class="track"><span id="bar"></span></div><article class="sheet" id="page" aria-live="polite"></article></main><nav class="nav"><div class="nav-inner"><button class="btn secondary" id="prev" type="button">← Previous</button><span>Move on when the speaker says so</span><button class="btn" id="next" type="button">Next →</button></div></nav><div id="toast" class="toast" role="status"></div><script>
const LIB=[{"name": "Financial hardship", "verses": [{"ref": "Matthew 6:31–33", "text": "“Therefore don’t be anxious, saying, ‘What will we eat?’, ‘What will we drink?’ or, ‘With what will we be clothed?’\nFor the Gentiles seek after all these things; for your heavenly Father knows that you need all these things.\nBut seek first God’s Kingdom, and his righteousness; and all these things will be given to you as well."}, {"ref": "Philippians 4:12–13", "text": "I know how to be humbled, and I know also how to abound. In everything and in all things I have learned the secret both to be filled and to be hungry, both to abound and to be in need.\nI can do all things through Messiah, who strengthens me."}]}, {"name": "Work and livelihood", "verses": [{"ref": "Colossians 3:23–24", "text": "And whatever you do, work heartily, as for the Lord, and not for men,\nknowing that from the Lord you will receive the reward of the inheritance; for you serve the Lord Messiah."}, {"ref": "Philippians 4:6–7", "text": "In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God.\nAnd the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Messiah Yeshua."}]}, {"name": "Financial security in the future", "verses": [{"ref": "1 Timothy 6:17", "text": "Charge those who are rich in this present world that they not be haughty, nor have their hope set on the uncertainty of riches, but on the living God, who richly provides us with everything to enjoy;"}, {"ref": "Hebrews 13:5", "text": "Be free from the love of money, content with such things as you have, for he has said, “I will in no way leave you, neither will I in any way forsake you.”"}]}, {"name": "Children and grandchildren", "verses": [{"ref": "Deuteronomy 6:6–7", "text": "These words, which I command you today, shall be on your heart;\nand you shall teach them diligently to your children, and shall talk of them when you sit in your house, and when you walk by the way, and when you lie down, and when you rise up."}, {"ref": "Philippians 4:6–7", "text": "In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God.\nAnd the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Messiah Yeshua."}]}, {"name": "Marriage and family conflict", "verses": [{"ref": "Romans 12:18", "text": "If it is possible, as much as it is up to you, be at peace with all men."}, {"ref": "Ephesians 4:32", "text": "And be kind to one another, tender hearted, forgiving each other, just as God also in Messiah forgave you."}]}, {"name": "Loneliness and rejection", "verses": [{"ref": "Hebrews 13:5–6", "text": "Be free from the love of money, content with such things as you have, for he has said, “I will in no way leave you, neither will I in any way forsake you.”\nSo that with good courage we say, “The Lord is my helper. I will not fear. What can man do to me?”"}, {"ref": "Romans 8:38–39", "text": "For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers,\nnor height, nor depth, nor any other created thing, will be able to separate us from God’s love, which is in Messiah Yeshua our Lord."}]}, {"name": "Aging parents and caring for them", "verses": [{"ref": "1 Timothy 5:4", "text": "But if any widow has children or grandchildren, let them learn first to show piety towards their own family, and to repay their parents, for this is acceptable in the sight of God."}, {"ref": "James 1:5", "text": "But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach; and it will be given to him."}]}, {"name": "Personal health", "verses": [{"ref": "2 Corinthians 12:9", "text": "He has said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Most gladly therefore I will rather glory in my weaknesses, that the power of Messiah may rest on me."}, {"ref": "Romans 8:23", "text": "Not only so, but ourselves also, who have the first fruits of the Spirit, even we ourselves groan within ourselves, waiting for adoption, the redemption of our body."}]}, {"name": "Anxiety, despair and exhaustion", "verses": [{"ref": "1 Peter 5:7", "text": "casting all your worries on him, because he cares for you."}, {"ref": "Psalm 42:5", "text": "Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him for the saving help of his presence."}]}, {"name": "War and physical danger", "verses": [{"ref": "Psalm 46:1–2", "text": "God is our refuge and strength, a very present help in trouble.\nTherefore we won’t be afraid, though the earth changes, though the mountains are shaken into the heart of the seas;"}, {"ref": "Psalm 56:3–4", "text": "When I am afraid, I will put my trust in you.\nIn God, I praise his word. In God, I put my trust. I will not be afraid. What can flesh do to me?"}]}, {"name": "Loss and grief", "verses": [{"ref": "1 Thessalonians 4:13–14", "text": "But we don’t want you to be ignorant, brothers, concerning those who have fallen asleep, so that you don’t grieve like the rest, who have no hope.\nFor if we believe that Yeshua died and rose again, even so God will bring with him those who have fallen asleep in Yeshua."}, {"ref": "John 11:25–26", "text": "Yeshua said to her, “I am the resurrection and the life. He who believes in me will still live, even if he dies.\nWhoever lives and believes in me will never die. Do you believe this?”"}]}, {"name": "Ongoing suffering", "verses": [{"ref": "Romans 8:18", "text": "For I consider that the sufferings of this present time are not worthy to be compared with the glory which will be revealed toward us."}, {"ref": "Revelation 21:4", "text": "He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain, any more. The first things have passed away.”"}]}, {"name": "Fear of failure", "verses": [{"ref": "1 Corinthians 15:58", "text": "Therefore, my beloved brothers, be steadfast, immovable, always abounding in the Lord’s work, because you know that your labor is not in vain in the Lord."}, {"ref": "Mark 8:36", "text": "For what does it profit a man, to gain the whole world, and forfeit his life?"}]}, {"name": "Big decisions and uncertainty", "verses": [{"ref": "James 1:5", "text": "But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach; and it will be given to him."}, {"ref": "Proverbs 3:5–6", "text": "Trust in the LORD with all your heart, and don’t lean on your own understanding.\nIn all your ways acknowledge him, and he will make your paths straight."}]}, {"name": "Purpose and meaning", "verses": [{"ref": "Ephesians 2:10", "text": "For we are his workmanship, created in Messiah Yeshua for good works, which God prepared before that we would walk in them."}, {"ref": "Colossians 1:16", "text": "For by him all things were created, in the heavens and on the earth, things visible and things invisible, whether thrones or dominions or principalities or powers; all things have been created through him, and for him."}]}, {"name": "Aging and death", "verses": [{"ref": "Psalm 90:12", "text": "So teach us to count our days, that we may gain a heart of wisdom."}, {"ref": "John 11:25–26", "text": "Yeshua said to her, “I am the resurrection and the life. He who believes in me will still live, even if he dies.\nWhoever lives and believes in me will never die. Do you believe this?”"}]}, {"name": "Regrets and past mistakes", "verses": [{"ref": "1 John 1:9", "text": "If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness."}, {"ref": "Romans 8:1", "text": "There is therefore now no condemnation to those who are in Messiah Yeshua."}]}, {"name": "Change and loss of control", "verses": [{"ref": "James 4:13–15", "text": "Come now, you who say, “Today or tomorrow let’s go into this city, and spend a year there, trade, and make a profit.”\nWhereas you don’t know what your life will be like tomorrow. For what is your life? For you are a vapor, that appears for a little time, and then vanishes away.\nFor you ought to say, “If the Lord wills, we will both live, and do this or that.”"}, {"ref": "Hebrews 13:8", "text": "Yeshua the Messiah is the same yesterday, today, and forever."}]}, {"name": "Spiritual weakness or doubt", "verses": [{"ref": "Mark 9:24", "text": "Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”"}, {"ref": "Hebrews 4:15–16", "text": "For we don’t have a high priest who can’t be touched with the feeling of our infirmities, but one who has been in all points tempted like we are, yet without sin.\nLet us therefore draw near with boldness to the throne of grace, that we may receive mercy, and may find grace for help in time of need."}]}, {"name": "Temptation and recurring sin", "verses": [{"ref": "1 Corinthians 10:13", "text": "No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it."}, {"ref": "1 John 2:1", "text": "My little children, I write these things to you so that you may not sin. If anyone sins, we have a Counselor with the Father, Yeshua the Messiah, the righteous."}]}, {"name": "Opposition because of faith", "verses": [{"ref": "John 16:33", "text": "I have told you these things, that in me you may have peace. In the world you have oppression; but cheer up! I have overcome the world.”"}, {"ref": "1 Peter 4:14", "text": "If you are insulted for the name of Messiah, you are blessed; because the Spirit of glory and of God rests on you. On their part he is blasphemed, but on your part he is glorified."}]}, {"name": "Loved ones who don’t believe", "verses": [{"ref": "1 Timothy 2:3–4", "text": "For this is good and acceptable in the sight of God our Savior;\nwho desires all people to be saved and come to full knowledge of the truth."}, {"ref": "Romans 10:13–14", "text": "For, “Whoever will call on the name of the Lord will be saved.”\nHow then will they call on him in whom they have not believed? How will they believe in him whom they have not heard? How will they hear without a preacher?"}]}];
const QUESTIONS=["When I think about my future, I usually expect good things rather than bad things.", "When unexpected difficulties come up, my first reaction is usually to believe the situation can improve.", "When things are uncertain, I tend to focus on what could go well more than on what could go wrong.", "Even after disappointments, I usually believe a way forward can be found.", "When I think about the coming years, I feel more hope than fear."];
const TITLES=["Personal questionnaire", "My concern", "What do I believe?", "Choosing topics and Scriptures", "Commitment for the week", "Review and save"];
const KEY='optimism-hope-interactive-en-v1';let state={page:0,scores:[0,0,0,0,0],fear:'',beliefs:'',concerns:[],selected:[],other:'',truth:'',commitment:''};
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&typeof old==='object')state={...state,...old};}catch(e){}
if(!Array.isArray(state.concerns))state.concerns=[];if(!Array.isArray(state.selected))state.selected=[];if(!Array.isArray(state.scores)||state.scores.length!==5)state.scores=[0,0,0,0,0];state.page=Math.min(5,Math.max(0,Number(state.page)||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
function note(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',3000)}
function field(k,label,hint='Write here, personally...'){return `<label class="field" for="f_${k}">${esc(label)}</label><textarea id="f_${k}" data-field="${k}" placeholder="${esc(hint)}">${esc(state[k])}</textarea>`}
function chosen(){return state.selected.map(id=>{const [i,j]=id.split(':').map(Number);return LIB[i]?.verses[j]}).filter(Boolean)}
function render(){const n=state.page;document.getElementById('pageNum').textContent=`Page ${n+1} of 6`;document.getElementById('sectionName').textContent=TITLES[n];document.getElementById('bar').style.width=((n+1)/6*100)+'%';document.getElementById('prev').disabled=n===0;document.getElementById('next').textContent=n===5?'Start over ↺':'Next →';let body='';
if(n===0){const done=state.scores.filter(Boolean).length,total=state.scores.reduce((a,b)=>a+b,0);body=`<h2>How do you usually look at the future?</h2><p class="muted">Choose a number from 1 (strongly disagree) to 5 (strongly agree) for each statement. This is an exercise for personal reflection, not a test of faith.</p>`+QUESTIONS.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q)}</h3><div class="scale">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="score${i}" value="${v}" data-score="${i}" ${state.scores[i]===v?'checked':''}><div>${v}</div></label>`).join('')}</div><div class="scaleLegend"><span>Strongly disagree</span><span>Strongly agree</span></div></div>`).join('')+`<div class="score"><span>${done} of 5 questions answered</span><br><b>${done===5?total+' / 25':'—'}</b><p>${done<5?'Answer all the questions to see your result.':total<=11?'Your answers lean toward a more pessimistic outlook.':total<=18?'Your answers reflect a mixed or cautious outlook.':'Your answers lean toward a more optimistic outlook.'}</p><p class="small">The score ranges are for illustration only and are not based on a validated research questionnaire.</p></div>`}
if(n===1)body=`<h2>What worries me most?</h2><p>Think about a real fear, worry or uncertainty about the future. Write down exactly what you are afraid will happen. Later you will be able to choose topics and Scriptures that fit your situation.</p>${field('fear','What is my main fear or worry?')}<div class="note">Your answers are not sent to the speaker or the congregation.</div>`;
if(n===2)body=`<h2>What do I believe about God and my future?</h2><p>Look at the worry you wrote down. What do you know as fact, and what is a fear or an assumption? Is there a thought about God that needs to be examined in the light of His Word?</p>${state.fear?`<div class="panel"><strong>The worry I wrote down:</strong><p>${esc(state.fear)}</p></div>`:''}${field('beliefs','What do I believe about God, His faithfulness or my future?')}`;
if(n===3){body=`<h2>Choose the worries and Scriptures that fit you</h2><p>You can choose several topics. After you choose, two Scripture passages will appear for each topic. Check only the passages you want to keep and come back to.</p><div class="groups">${LIB.map((x,i)=>`<button type="button" class="category ${state.concerns.includes(i)?'active':''}" data-category="${i}" aria-pressed="${state.concerns.includes(i)}"><span>${state.concerns.includes(i)?'✓':i+1+'.'}</span>${esc(x.name)}</button>`).join('')}</div>`;if(state.concerns.length)body+=state.concerns.map(i=>`<section class="panel"><h3>${esc(LIB[i].name)}</h3>${LIB[i].verses.map((v,j)=>{const id=i+':'+j;return `<div class="passage"><label><input type="checkbox" data-verse="${id}" ${state.selected.includes(id)?'checked':''}> ${esc(v.ref)} — keep this passage</label><p class="verse">${esc(v.text)}</p></div>`}).join('')}</section>`).join('');else body+='<div class="note">Choose one or more topics to see the Scripture passages.</div>';body+=field('other','Another Scripture (optional)','You can write a reference or a thought from another passage here...')+field('truth','What can I trust God to do, according to the Scriptures?','Write what the Scriptures really promise, even if the circumstances do not change...')}
if(n===4){const names=state.concerns.map(i=>LIB[i]?.name).filter(Boolean);const verses=chosen();body=`<h2>What will I do in the next seven days?</h2><p>Choose one practical step of faith or obedience that you can carry out this week.</p><div class="note">When I worry about <strong>${names.length?names.map(esc).join(', '):'the things that trouble me'}</strong>, I will remember God’s Word:</div><ul class="picked">${verses.map(v=>`<li><strong>${esc(v.ref)}</strong><p class="verse">${esc(v.text)}</p></li>`).join('')||'<li>No passages chosen yet. You can go back to page 4 and choose some.</li>'}${state.other?`<li>${esc(state.other)}</li>`:''}</ul>${field('commitment','So this week I commit to...','Write one clear action you can carry out in the coming week...')}<p class="small">The goal is not to control the outcome, but to respond faithfully to God.</p>`}
if(n===5){const names=state.concerns.map(i=>LIB[i]?.name).filter(Boolean),verses=chosen();body=`<h2>Review and save your personal exercise</h2><p>Go over your answers. You can go back to any page and edit them.</p><div class="summary"><strong>Questionnaire</strong><p>${state.scores.every(Boolean)?state.scores.reduce((a,b)=>a+b,0)+' of 25':'Not completed'}</p></div><div class="summary"><strong>My worry</strong><p>${esc(state.fear||'Not written')}</p></div><div class="summary"><strong>What I believe</strong><p>${esc(state.beliefs||'Not written')}</p></div><div class="summary"><strong>Topics I chose</strong><p>${names.map(esc).join(', ')||'None chosen'}</p></div><div class="summary"><strong>Scriptures I chose</strong><ul class="picked">${verses.map(v=>`<li><strong>${esc(v.ref)}</strong><p class="verse">${esc(v.text)}</p></li>`).join('')||'<li>None chosen</li>'}</ul></div><div class="summary"><strong>Another thought</strong><p>${esc(state.other||'—')}</p></div><div class="summary"><strong>What the Scriptures teach me</strong><p>${esc(state.truth||'—')}</p></div><div class="summary"><strong>My commitment for the coming week</strong><p>${esc(state.commitment||'Not written')}</p></div><div class="actions"><button class="btn" id="download" type="button">↓ Save the exercise as an HTML file</button><button class="btn outline" id="email" type="button">Email it to myself</button><button class="btn secondary" id="print" type="button">Print / save as PDF</button></div><div class="note small">The downloaded file contains your personal answers and the Scriptures you chose, and it opens without an internet connection. Sending by email may expose your answers to your email provider. Nothing is sent automatically.</div>`}
document.getElementById('page').innerHTML=body;document.querySelectorAll('[data-score]').forEach(el=>el.addEventListener('change',()=>{state.scores[+el.dataset.score]=+el.value;save();render()}));document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.field]=el.value;save()}));document.querySelectorAll('[data-category]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.category;state.concerns=state.concerns.includes(i)?state.concerns.filter(x=>x!==i):[...state.concerns,i].sort((a,b)=>a-b);state.selected=state.selected.filter(id=>state.concerns.includes(+id.split(':')[0]));save();render()}));document.querySelectorAll('[data-verse]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.verse;state.selected=el.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);save()}));document.getElementById('download')?.addEventListener('click',download);document.getElementById('email')?.addEventListener('click',email);document.getElementById('print')?.addEventListener('click',()=>window.print())}
function go(d){state.page=d===99?0:Math.min(5,Math.max(0,state.page+d));save();render();window.scrollTo(0,0)}document.getElementById('prev').addEventListener('click',()=>go(-1));document.getElementById('next').addEventListener('click',()=>go(state.page===5?99:1));
function report(){const names=state.concerns.map(i=>LIB[i]?.name).filter(Boolean);return [['Questionnaire result',state.scores.every(Boolean)?state.scores.reduce((a,b)=>a+b,0)+'/25':'Not completed'],['My worry',state.fear],['What I believe',state.beliefs],['Topics',names.join(', ')],['Chosen Scriptures',chosen().map(v=>v.ref).join('; ')],['Another Scripture',state.other],['What the Scriptures teach me',state.truth],['My commitment for the week',state.commitment]]}
function download(){const entries=report();const doc=`<!doctype html><html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My personal exercise — Optimism and Hope</title><style>body{font-family:Arial,sans-serif;line-height:1.9;max-width:760px;margin:30px auto;padding:0 18px;color:#17343a}h1{color:#116c6b}.item{padding:12px 0;border-bottom:1px solid #ddd;white-space:pre-wrap}.verse{padding:14px;background:#eef5f2;border-radius:10px;margin:12px 0;white-space:pre-line}</style><h1>Optimism and Hope — My personal exercise</h1>${entries.map(([k,v])=>`<div class="item"><strong>${esc(k)}</strong><div>${esc(v||'—')}</div></div>`).join('')}<h2>The Scriptures I chose</h2>${chosen().map(v=>`<div class="verse"><strong>${esc(v.ref)}</strong><p>${esc(v.text)}</p></div>`).join('')||'<p>No Scriptures chosen.</p>'}</html>`;const u=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='my-optimism-and-hope-study.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500);note('The file is ready to save on your device')}
function email(){const b=report().map(([k,v])=>k+'\n'+(v||'—')).join('\n\n')+'\n\n'+chosen().map(v=>v.ref+'\n'+v.text).join('\n\n');const href='mailto:?subject='+encodeURIComponent('My personal exercise — Optimism and Hope')+'&body='+encodeURIComponent(b);if(href.length>16000){note('The message is too long. Save the HTML file instead.');return}window.location.href=href}
render();
</script></body></html>
